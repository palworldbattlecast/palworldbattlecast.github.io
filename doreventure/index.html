<script>
(function(){
var W=1280,H=720,app=document.getElementById('app'),scr=document.getElementById('screen'),pad=document.getElementById('pad'),dp=document.getElementById('dpad');
var inst=null;function send(m,a){if(inst)try{inst.SendMessage('DoreVPad',m,a||'')}catch(e){}}
function box(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px'}
function layout(){
 var cs=getComputedStyle(app),pl=parseFloat(cs.paddingLeft),pr=parseFloat(cs.paddingRight),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom);
 var aw=innerWidth-pl-pr,ah=innerHeight-pt-pb,portrait=ah>aw,sw,sh,sx,sy,d,ab;
 box(pad,pl,pt,aw,ah);
 if(portrait){ // Game Boy style: picture on top, controls underneath
  sw=aw;sh=Math.round(sw*H/W);sx=pl;sy=pt;
  var cy=sh+10,ch=ah-sh-10;d=Math.min(aw*0.46,ch*0.78,190);ab=Math.min(d*0.42,80);
  var mid=cy+Math.max(ch*0.48,d/2+50);
  box(dp,14,mid-d/2,d,d);
  box(document.getElementById('bA'),aw-14-ab,mid-ab*1.05,ab,ab);
  box(document.getElementById('bB'),aw-14-ab*2.15,mid-ab*0.05,ab,ab);
  box(document.getElementById('bM'),aw/2-45,cy+8,90,40);
 }else{ // landscape: picture as big as fits, buttons over the side margins
  sh=ah;sw=Math.round(sh*W/H);if(sw>aw){sw=aw;sh=Math.round(sw*H/W)}sx=pl+(aw-sw)/2;sy=pt+(ah-sh)/2;
  d=Math.min(ah*0.46,170);ab=Math.min(d*0.42,72);
  box(dp,8,ah-d-10,d,d);
  box(document.getElementById('bA'),aw-8-ab,ah-ab*2.1-10,ab,ab);
  box(document.getElementById('bB'),aw-8-ab*2.1,ah-ab*1.05-10,ab,ab);
  box(document.getElementById('bM'),aw-8-84,8,84,36);
 }
 box(scr,sx,sy,sw,sh);
 var c=d/3;[['d1',c,0],['d0',c,2*c],['d2',0,c],['d3',2*c,c]].forEach(function(a){box(document.getElementById(a[0]),a[1],a[2],c,c)});
}
addEventListener('resize',layout);addEventListener('orientationchange',function(){setTimeout(layout,250)});layout();
// D-pad: one touch area, direction picked from the touch angle so the thumb can slide between arrows
var cur=-1;function setDir(n){if(n===cur)return;if(cur>=0){send('VPad','d'+cur+':0');document.getElementById('d'+cur).classList.remove('on')}cur=n;if(n>=0){send('VPad','d'+n+':1');document.getElementById('d'+n).classList.add('on');if(navigator.vibrate)navigator.vibrate(8)}}
function dirAt(e){var r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(x*x+y*y<(r.width*0.1)*(r.width*0.1))return cur;return Math.abs(x)>Math.abs(y)?(x<0?2:3):(y<0?1:0)}
dp.addEventListener('pointerdown',function(e){e.preventDefault();dp.setPointerCapture(e.pointerId);setDir(dirAt(e))});
dp.addEventListener('pointermove',function(e){if(cur>=0||e.buttons)setDir(dirAt(e))});
['pointerup','pointercancel','lostpointercapture'].forEach(function(t){dp.addEventListener(t,function(){setDir(-1)})});
[['bA','A'],['bB','B'],['bM','M']].forEach(function(b){var el=document.getElementById(b[0]);
 el.addEventListener('pointerdown',function(e){e.preventDefault();el.classList.add('on');send('VPad',b[1]);if(navigator.vibrate)navigator.vibrate(8)});
 ['pointerup','pointercancel','pointerleave'].forEach(function(t){el.addEventListener(t,function(){el.classList.remove('on')})})});

addEventListener('pagehide',function(){send('WebFlush')});

var t0=performance.now();window.__t0=t0;

if(typeof DecompressionStream==='undefined'){err.textContent='Please update iOS / your browser (needs Safari 16.4 or newer).';return}
function b64(t){var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
fetch('Build/parts.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(man){
 var all=[],total=0,got=0;Object.keys(man.files).forEach(function(k){man.files[k].parts.forEach(function(n,i){all.push({k:k,i:i,n:n});});total+=man.files[k].gz});
 var bufs={};Object.keys(man.files).forEach(function(k){bufs[k]=[]});
 var q=all.slice(),running=0;
 return new Promise(function(res,rej){
  function next(){if(!q.length){if(!running)res();return}var it=q.shift();running++;
   fetch('Build/'+it.n).then(function(r){if(!r.ok)throw r.status;return r.text()}).then(function(t){var u=b64(t);bufs[it.k][it.i]=u;got+=u.length;
     var f=got/total*0.9;fill.style.width=Math.round(f*100)+'%';pct.textContent='Downloading… '+Math.round(got/1048576)+' / '+Math.round(total/1048576)+' MB';running--;next()}).catch(rej)}
  for(var j=0;j<4;j++)next();
 }).then(function(){pct.textContent='Unpacking…';
  return Promise.all(Object.keys(bufs).map(function(k){var st=new Blob(bufs[k]).stream().pipeThrough(new DecompressionStream('gzip'));

}).then(function(urls){var U={};urls.forEach(function(x){U[x[0]]=x[1]});

  dataUrl:U['out.data'],frameworkUrl:U['out.framework.js'],codeUrl:U['out.wasm'],
  streamingAssetsUrl:'StreamingAssets',companyName:'DefaultCompany',productName:'Doreventure',productVersion:'1.0',
  devicePixelRatio:dpr,matchWebGLToCanvasSize:true,autoSyncPersistentDataPath:true,cacheControl:function(){return 'no-store'}},function(p){fill.style.width=Math.round(90+p*10)+'%';pct.textContent='Starting… '}) 
 .then(function(u){inst=window.unityInstance=u;window.__loadMs=Math.round(performance.now()-t0);pct.textContent='Ready';document.getElementById('bar').style.display='none';tap.style.display='block';
   ld.addEventListener('pointerup',function(){ld.style.display='none';try{var A=window.AudioContext||window.webkitAudioContext;if(A){var a=new A();a.resume();a.close()}}catch(e){}},{once:true})})
 .catch(function(m){err.textContent='Could not start: '+m})};
 document.body.appendChild(s);
}).catch(function(e){err.textContent='Could not download the game ('+e+'). Check your connection and reload.'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
