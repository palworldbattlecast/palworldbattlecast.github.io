<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{margin:0;height:100%;background:#d99e00;overflow:hidden;touch-action:none;-ms-touch-action:none;font-family:-apple-system,"SF Pro Rounded",Helvetica,Arial,sans-serif;color:#eee;overscroll-behavior:none;position:fixed;inset:0}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 background:radial-gradient(120% 70% at 30% 10%,#ffe878 0,#ffd21f 38%,#f5bd12 70%,#e0a400 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 18px rgba(150,90,0,.35)}
#bezel{position:absolute;border-radius:16px 16px 16px 16px;background:linear-gradient(180deg,#3a3b48,#22232c);box-shadow:0 3px 0 rgba(255,255,255,.35),0 -1px 0 rgba(120,70,0,.5),inset 0 1px 2px rgba(255,255,255,.18),0 10px 22px rgba(120,70,0,.35)}
#brand{position:absolute;font-weight:900;font-style:italic;letter-spacing:.5px;color:#d7262e;text-shadow:0 1px 0 rgba(255,255,255,.55);white-space:nowrap;pointer-events:none}
#brand b{color:#1f5fd1}
#screen{position:absolute;background:#000;border-radius:4px;overflow:hidden}
#unity-canvas{width:100%;height:100%;display:block;background:#000;image-rendering:pixelated;outline:none}
#pad{position:absolute;pointer-events:none}
/* glass D-pad */
#dpad{position:absolute;pointer-events:auto;border-radius:50%;
 background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),rgba(255,255,255,.18) 45%,rgba(255,255,255,.08) 100%);
 -webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);
 border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 2px 6px rgba(255,255,255,.7),inset 0 -8px 16px rgba(160,100,0,.25),0 10px 22px rgba(130,80,0,.35)}
#dpad .bar{position:absolute;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.65),rgba(255,255,255,.22));border:1px solid rgba(255,255,255,.8);
 box-shadow:inset 0 1px 3px rgba(255,255,255,.9),0 3px 8px rgba(120,70,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#dpad .ar{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.55;transition:opacity .08s}
#dpad .ar.on{opacity:1}
#a1{border-bottom-color:#5a4a20!important;border-top-width:0!important}#a0{border-top-color:#5a4a20!important;border-bottom-width:0!important}
#a2{border-right-color:#5a4a20!important;border-left-width:0!important}#a3{border-left-color:#5a4a20!important;border-right-width:0!important}
#knob{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.45) 55%,rgba(255,255,255,.25));
 border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(110,70,0,.35),inset 0 -3px 6px rgba(160,110,20,.25);transition:transform .07s ease-out;pointer-events:none}
/* glossy A / B */
.ab{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;
 text-shadow:0 -1px 0 rgba(0,0,0,.35);transition:transform .05s,box-shadow .05s}
.ab:before{content:"";position:absolute;left:16%;top:7%;width:62%;height:40%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.ab:after{content:"";position:absolute;right:20%;bottom:16%;width:14%;height:14%;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(1px)}
#bA{background:radial-gradient(circle at 38% 30%,#ff9a9a 0,#f2373f 38%,#c4141d 70%,#86070d 100%);box-shadow:0 5px 0 #7c0910,0 10px 18px rgba(110,10,10,.45),inset 0 -5px 9px rgba(80,0,0,.4)}
#bB{background:radial-gradient(circle at 38% 30%,#a9c8ff 0,#3f7cf2 38%,#1a4fc4 70%,#0a2d86 100%);box-shadow:0 5px 0 #0b2a7c,0 10px 18px rgba(10,30,110,.45),inset 0 -5px 9px rgba(0,10,80,.4)}
.ab.on{transform:translateY(4px)}#bA.on{box-shadow:0 1px 0 #7c0910,0 4px 8px rgba(110,10,10,.4),inset 0 -3px 7px rgba(80,0,0,.4)}
#bB.on{box-shadow:0 1px 0 #0b2a7c,0 4px 8px rgba(10,30,110,.4),inset 0 -3px 7px rgba(0,10,80,.4)}
.abl{position:absolute;color:#8a5a00;font-weight:800;font-size:12px;text-align:center;pointer-events:none}
.pill{position:absolute;pointer-events:auto;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:1.5px;color:#fff;
 background:linear-gradient(180deg,#6d6f7d,#3b3c47);box-shadow:0 3px 0 #2a2b33,0 6px 12px rgba(110,70,0,.35),inset 0 1px 1px rgba(255,255,255,.4);transition:transform .05s}
.pill.on{transform:translateY(2px);box-shadow:0 1px 0 #2a2b33,inset 0 1px 1px rgba(255,255,255,.3)}
#grill{position:absolute;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#grill i{display:block;width:5px;height:5px;border-radius:50%;background:rgba(120,70,0,.45);box-shadow:inset 0 1px 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.5)}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14151c;z-index:5;text-align:center;padding:12px}
#load img{width:72px;height:72px;image-rendering:pixelated;border-radius:16px}
#bar{width:70%;max-width:240px;height:9px;border:2px solid #fff;border-radius:6px;margin:12px 0 6px;overflow:hidden}#fill{height:100%;width:0;background:#ffd23c}
#pct{font-size:13px}
#tap{display:none;margin-top:10px;padding:10px 22px;border-radius:12px;background:#ffd23c;color:#222;font-weight:800;font-size:16px}
#err{color:#f88;font-size:13px;max-width:320px}
#intro{position:fixed;inset:0;z-index:20;background:#000;touch-action:none}
#intro canvas{width:100%;height:100%;display:block}
#skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));width:100%;text-align:center;color:rgba(255,230,140,.7);font-size:12px;letter-spacing:2px;pointer-events:none}

// ---------- no zooming, ever (iOS Safari ignores user-scalable=no, so block the gestures themselves) ----------
var vp=document.getElementById('vp'),VPC=vp.content;
function nz(e){if(e.cancelable)e.preventDefault()}
['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(t){document.addEventListener(t,nz,{passive:false})});
document.addEventListener('touchstart',function(e){if(e.touches.length>1)nz(e)},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1||(e.scale&&e.scale!==1))nz(e)},{passive:false});
var lastEnd=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastEnd<350)nz(e);lastEnd=n},{passive:false});
function unzoom(){if(window.visualViewport&&visualViewport.scale>1.01){vp.content=VPC.replace('maximum-scale=1','maximum-scale=1.01');setTimeout(function(){vp.content=VPC;window.scrollTo(0,0)},30)}}
if(window.visualViewport)visualViewport.addEventListener('resize',unzoom);

var W=1280,H=720,app=document.getElementById('app'),scr=document.getElementById('screen'),pad=document.getElementById('pad'),dp=document.getElementById('dpad');
var $=function(i){return document.getElementById(i)};
var wantStart=false;
// A / START (or Enter/Space) on the loading screen: dismiss "Tap to play" now, or as soon as the game is ready
function startPress(){var L=document.getElementById('load');if(!L||L.style.display=='none')return false;
 if(document.getElementById('tap').style.display=='block'){L.dispatchEvent(new Event('pointerup'))}
 else{wantStart=true;var p=document.getElementById('pct');if(p&&p.textContent.indexOf('Starting')<0)p.textContent='Starting\u2026 (game opens when ready)'}
 return true}
document.addEventListener('keydown',function(e){if((e.key=='Enter'||e.key==' '||e.key=='z'||e.key=='x')&&startPress())e.preventDefault()});
var inst=null;function send(m,a){if(inst)try{inst.SendMessage('DoreVPad',m,a||'')}catch(e){}}
function box(el,x,y,w,h){el.style.left=Math.round(x)+'px';el.style.top=Math.round(y)+'px';el.style.width=Math.round(w)+'px';el.style.height=Math.round(h)+'px'}
function layout(){
 var cs=getComputedStyle(app),pl=parseFloat(cs.paddingLeft),pr=parseFloat(cs.paddingRight),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom);

 box(pad,pl,pt,aw,ah);
 if(portrait){ // DoreStation, upright: big screen up top, controls below
  var m=5;bz=5;sw=aw-2*m-2*bz;bx=m;by=m+4; // edge-to-edge screen, thinnest bezel
  brandSize=Math.max(13,Math.min(19,aw*0.045));
  var bottomRow=50;
  d=Math.min(aw*0.4,184);ab=Math.min(aw*0.185,82);

  var gap=ab*0.42;ax=aw-dx-ab;ay=mid-ab*0.95;

  sh=Math.max(Math.round(sw*H/W),Math.floor(Math.min(dy,ay)-26-by-2*bz));

  box(dp,dx,dy,d,d);
  var by2=ah-bottomRow+8;box($('bM'),dx,by2,78,28);box($('bS'),aw-dx-78,by2,78,28);

  box($('grill'),aw-dx-40,by+sh+2*bz+10,40,15);
 }else{ // DoreStation, sideways: screen in the middle, thumbs either side
  var side=Math.max(120,Math.min(aw*0.2,190));
  sh=ah-2*10-2*bz;sw=Math.round(sh*W/H);
  if(sw>aw-2*side){sw=aw-2*side;sh=Math.round(sw*H/W)}
  bx=(aw-sw)/2-bz;by=Math.max(8,(ah-sh-2*bz)/2-10);
  var sL=bx,sR=aw-(bx+sw+2*bz);
  d=Math.min(sL-22,ah*0.46,170);ab=Math.min((sR-30)/2.3,ah*0.19,72);
  dx=(sL-d)/2;dy=ah*0.47-d/2;
  var g=ab*0.3,cx=bx+sw+2*bz+(sR-(ab*2+g))/2;
  box($('bA'),cx+ab+g,ah*0.47-ab*0.95,ab,ab);box($('bB'),cx,ah*0.47-ab*0.05+4,ab,ab);
  box(dp,dx,dy,d,d);
  box($('bM'),Math.max(8,(sL-72)/2),ah-38,72,26);box($('bS'),aw-Math.max(8,(sR-72)/2)-72,ah-38,72,26);
  brandSize=13;$('brand').style.textAlign='left';box($('brand'),bx+8,by+sh+2*bz+2,300,18);$('brand').style.fontSize=brandSize+'px';
  box($('grill'),aw-sR/2-20,12,40,15);
 }
 box($('bezel'),pl+bx,pt+by,sw+2*bz,sh+2*bz);box(scr,pl+bx+bz,pt+by+bz,sw,sh);

function dirAt(e){var r=dp.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(x*x+y*y<(r.width*0.1)*(r.width*0.1))return cur;return Math.abs(x)>Math.abs(y)?(x<0?2:3):(y<0?1:0)}
